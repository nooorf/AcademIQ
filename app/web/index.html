<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AcademIQ — NUST Policy Atlas</title>
  <meta name="description" content="Ask NUST SEECS UG and PG handbook policy questions and get cited answers from a MinHash, SimHash and TF-IDF retrieval pipeline.">
  <meta name="theme-color" content="#080e1d">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23080e1d'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23ec5b3e' stroke-width='1.5'/%3E%3Cpath d='M16 5l2.2 8.8L27 16l-8.8 2.2L16 27l-2.2-8.8L5 16l8.8-2.2z' fill='%23ec5b3e'/%3E%3C/svg%3E">
  <link rel="preload" href="/static/fonts/Alegreya-Italic-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/AlegreyaSans-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-mark" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="15" fill="none" stroke="currentColor" stroke-width="1.25"/>
      <circle cx="20" cy="20" r="18.5" fill="none" stroke="currentColor" stroke-width="0.75" stroke-dasharray="1 3"/>
      <path d="M20 4.5l2.6 12.9L35.5 20l-12.9 2.6L20 35.5l-2.6-12.9L4.5 20l12.9-2.6z" fill="currentColor"/>
      <circle cx="20" cy="20" r="2" fill="#080e1d"/>
    </symbol>
    <symbol id="i-star" viewBox="0 0 20 20"><path d="M10 2.5l1.6 5.9 5.9 1.6-5.9 1.6-1.6 5.9-1.6-5.9-5.9-1.6 5.9-1.6z"/></symbol>
    <symbol id="i-search" viewBox="0 0 20 20"><circle cx="8.75" cy="8.75" r="5.5"/><path d="M13 13l4.5 4.5"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 20 20"><path d="M3.5 10h13M11.5 5l5 5-5 5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 20 20"><path d="M10 3l7.5 13.5h-15z"/><path d="M10 8.5v3.5M10 14.4v.1"/></symbol>
    <symbol id="i-clear" viewBox="0 0 20 20"><path d="M4 6h12M8 6V4h4v2M5.5 6l.8 10h7.4l.8-10"/></symbol>
    <symbol id="i-sort" viewBox="0 0 12 12"><path d="M6 2.5v7M3 6.5l3 3 3-3"/></symbol>
  </svg>

  <header class="top">
    <a class="brand" href="#ask" aria-label="AcademIQ home">
      <svg class="brand-mark" aria-hidden="true"><use href="#i-mark"/></svg>
      <span class="brand-name">AcademIQ</span>
      <span class="brand-sub">NUST SEECS policy atlas</span>
    </a>
    <nav class="tabs" aria-label="Views">
      <a class="tab" href="#ask" data-view="ask">Ask</a>
      <a class="tab" href="#compare" data-view="compare">Compare</a>
      <a class="tab" href="#health" data-view="health">Health</a>
    </nav>
    <div class="book" role="group" aria-label="Handbook">
      <button type="button" data-book="ug" aria-pressed="true">Undergraduate <small class="num" data-count="ug"></small></button>
      <button type="button" data-book="pg" aria-pressed="false">Postgraduate <small class="num" data-count="pg"></small></button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
